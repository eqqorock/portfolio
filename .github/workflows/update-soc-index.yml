name: Update SOC Reports Index

on:
  push:
    paths:
      - 'soc-reports/**/*.md'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Generate SOC reports index
        run: node scripts/generate_soc_index.js
        
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet soc-reports/index.json soc-reports/_index.json || echo "changes=true" >> $GITHUB_OUTPUT
          
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add soc-reports/index.json soc-reports/_index.json
          git commit -m "Auto-update SOC reports index [skip ci]"
          git push
