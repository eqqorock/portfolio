name: Regenerate SOC Index

on:
  push:
    branches: [ main ]
    paths:
      - 'soc-reports/**'
      - 'scripts/generate_soc_index.js'

jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run SOC index generator
        run: node scripts/generate_soc_index.js

      - name: Commit and push updated index if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soc-reports/_index.json soc-reports/index.json
          if git diff --cached --quiet; then
            echo "No changes to soc index"
          else
            git commit -m "chore(soc): regenerate index [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" HEAD:${{ github.ref_name }}
          fi
