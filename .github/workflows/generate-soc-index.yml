name: Generate SOC reports index

on:
  push:
    paths:
      - 'soc-reports/**'
    paths-ignore:
      - 'soc-reports/_index.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Generate SOC index
        run: node ./scripts/generate_soc_index.js
      - name: Commit index.json if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add soc-reports/_index.json soc-reports/index.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update SOC index [skip ci]" || true
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
